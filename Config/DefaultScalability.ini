[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=0 ; 0 = Desliga o Lumen GI (volta pro sistema clássico ou sem GI dinâmico)
r.Lumen.HardwareRayTracing=0

[ReflectionQuality@0]
